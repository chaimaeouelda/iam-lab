# Module 5 - Nextcloud, protege par Keycloak (SAML 2.0)
services:
  nextcloud:
    image: nextcloud:32
    container_name: iam-nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    volumes:
      - nextcloud-data:/var/www/html

volumes:
  nextcloud-data:
