# Module 2 - Keycloak + PostgreSQL, HTTPS local via mkcert
# Acces : https://keycloak.lab.local
services:
  postgres:
    image: postgres:16
    container_name: iam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - iam-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: iam-keycloak
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://keycloak.lab.local
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/lab.local.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/lab.local-key.pem
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "443:8443"
    volumes:
      - ../certs:/opt/keycloak/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iam-net

volumes:
  pg-data:

networks:
  iam-net:
    name: iam-net
