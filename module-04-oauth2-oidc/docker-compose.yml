# Module 4 - Grafana protege par Keycloak (OIDC)
services:
  grafana:
    image: grafana/grafana:latest
    container_name: iam-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    extra_hosts:
      - "keycloak.lab.local:host-gateway"
    environment:
      SSL_CERT_FILE: /etc/ssl/mkcert/rootCA.pem
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://keycloak.lab.local/realms/acme/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://keycloak.lab.local/realms/acme/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://keycloak.lab.local/realms/acme/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(roles[*], 'acme-it-admin') && 'Admin' || contains(roles[*], 'acme-dg') && 'Editor' || 'Viewer'"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../certs/rootCA.pem:/etc/ssl/mkcert/rootCA.pem:ro

volumes:
  grafana-data:
